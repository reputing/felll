# Builds and deploys the site (OpenNext → Cloudflare Workers) from CI, so the
# live cupcake.gg updates without anyone running `npm run deploy` locally.
#
# Uses the same account secrets as the catalog sync:
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
#   CLOUDFLARE_API_TOKEN   — a token that can deploy Workers. The sync token only
#                            needs "D1: Edit"; deploying also needs
#                            "Workers Scripts: Edit" (and, for the cupcake.gg
#                            custom domain, "Workers Routes: Edit"). If the deploy
#                            fails with a permissions error, widen this token.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [claude/sweet-bell-gpo325]
    paths-ignore:
      - ".github/workflows/sync-catalog.yml"
      - "scripts/**"

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Make sure kuro's SSO secrets live on THIS worker (so "Continue with kuro"
      # works). Add KURO_SERVICE_KEY and KURO_SUPABASE_URL as GitHub Actions
      # secrets; set only when present, so this is a no-op until you add them.
      - name: Sync kuro secrets to the worker
        env:
          KURO_SERVICE_KEY: ${{ secrets.KURO_SERVICE_KEY }}
          KURO_SUPABASE_URL: ${{ secrets.KURO_SUPABASE_URL }}
        run: |
          if [ -n "$KURO_SERVICE_KEY" ]; then printf '%s' "$KURO_SERVICE_KEY" | npx wrangler secret put KURO_SERVICE_KEY; fi
          if [ -n "$KURO_SUPABASE_URL" ]; then printf '%s' "$KURO_SUPABASE_URL" | npx wrangler secret put KURO_SUPABASE_URL; fi
      # Apply any new D1 migrations before the new code goes live (idempotent —
      # wrangler skips migrations already recorded in the d1_migrations table).
      - run: npx wrangler d1 migrations apply felll --remote
      - run: npm run deploy
