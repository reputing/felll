<!doctype html>
<!--
  Source for public/og-v2.png (the cupcake.gg link-preview card, 1200x630).
  Edit here, then re-render with headless Chromium to a NEW filename (social
  platforms cache the embed by URL, so bump the name on each redesign), e.g.:
    chrome --headless --no-sandbox --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=6000 \
      --screenshot=public/og-v2.png file://$PWD/scripts/og-card.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#09080a;--line:#2a2229;
    --pink:#ff8fc4;--pink-soft:#ffa6d2;--pink-text:#ffb3da;
    --ink:#f7eef3;--muted:#a88d9b;
  }
  html,body{width:1200px;height:630px}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--ink);overflow:hidden;position:relative;
    -webkit-font-smoothing:antialiased;
  }
  .glow{position:absolute;width:980px;height:980px;right:-260px;top:-420px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,143,196,.30),rgba(255,143,196,0) 62%)}
  .glow2{position:absolute;width:760px;height:760px;left:-300px;bottom:-360px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,143,196,.12),rgba(255,143,196,0) 62%)}
  .shelf{position:absolute;right:-30px;top:78px;display:flex;gap:26px;transform:rotate(9deg);opacity:.42}
  .poster{width:158px;height:238px;border-radius:22px;border:1px solid #2f2530;
    box-shadow:0 36px 70px -34px rgba(0,0,0,.9);position:relative;overflow:hidden}
  .poster::before{content:"";position:absolute;inset-inline:0;top:0;height:5px;background:var(--pink);opacity:.8}
  .poster.a{background:linear-gradient(160deg,#3a2230,#17101a)}
  .poster.b{background:linear-gradient(160deg,#2b1b3c,#141018);margin-top:64px}
  .poster.c{background:linear-gradient(160deg,#1b2b30,#101418);margin-top:128px}
  .wrap{position:relative;padding:74px;height:100%;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:20px}
  .mark{width:78px;height:78px;filter:drop-shadow(0 8px 18px rgba(255,143,196,.4))}
  .word{font-weight:800;font-size:42px;letter-spacing:-1.6px}
  .word b{font-weight:800;background:linear-gradient(90deg,#ff8fc4,#ffb3da);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{margin-left:auto;font-size:14px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
    color:var(--pink-text);border:1.5px solid #4a2a3d;border-radius:999px;padding:10px 19px;
    background:rgba(255,143,196,.06)}
  .mid{margin-top:auto}
  h1{font-size:78px;line-height:.99;letter-spacing:-3.2px;font-weight:800;max-width:720px}
  h1 span{color:var(--pink-soft)}
  .sub{margin-top:24px;font-size:23px;font-weight:500;color:var(--muted);max-width:660px;line-height:1.4}
  .chips{margin-top:34px;display:flex;flex-wrap:wrap;gap:12px;max-width:780px}
  .chip{font-size:19px;font-weight:800;padding:10px 20px;border-radius:999px;
    color:var(--pink-text);background:rgba(255,143,196,.10);border:1.5px solid rgba(255,143,196,.34)}
  .genres{margin-top:15px;display:flex;flex-wrap:wrap;gap:10px;max-width:780px}
  .g{font-size:16px;font-weight:700;padding:7px 15px;border-radius:999px;color:#c7b0bd;border:1.5px solid #2a2229}
</style>
</head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="shelf"><div class="poster a"></div><div class="poster b"></div><div class="poster c"></div></div>
  <div class="wrap">
    <div class="top">
      <img class="mark" src="../public/cupcake.png" alt="">
      <div class="word">cupcake<b>.gg</b></div>
      <div class="tag">members only</div>
    </div>
    <div class="mid">
      <h1>your anime, manga<br>&amp; movies, <span>one box.</span></h1>
      <div class="sub">the kuro members' watch box. lists, ratings, threaded comments, next-episode countdowns, and every title on MyAnimeList.</div>
      <div class="chips">
        <div class="chip">Anime</div><div class="chip">Manga</div><div class="chip">Movies</div>
        <div class="chip">Seasonal</div><div class="chip">Schedule</div><div class="chip">Rankings</div>
      </div>
      <div class="genres">
        <div class="g">Action</div><div class="g">Romance</div><div class="g">Isekai</div>
        <div class="g">Shounen</div><div class="g">Slice of Life</div><div class="g">Fantasy</div>
      </div>
    </div>
  </div>
</body>
</html>
